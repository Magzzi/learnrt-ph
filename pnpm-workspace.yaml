packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@tailwindcss/oxide': true
  sharp: true
# pnpm normally refuses package versions published less than 24 hours ago
# (minimumReleaseAge, default 1440 minutes). `npx expo install` (M1, and
# expo-dev-client in M2) needed these Expo SDK 58 releases, published by the
# expo/expo GitHub Actions workflow on 2026-10-27 (last one at 16:12 UTC). Exact versions only, no wildcards.
# Remove this whole list on or after 2026-10-29, once the 24 hours have passed
# (docs/maintenance-todo.md, M1).
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.16"
  - "@expo/fingerprint@0.21.7"
  - "@expo/metro-config@58.0.18"
  - "@expo/router-server@58.0.18"
  - babel-preset-expo@58.0.21
  - expo-file-system@58.0.12
  - expo-modules-cli@0.3.3
  - expo-modules-core@58.0.27
  - expo-modules-jsi@58.0.20
  - expo@58.0.20
  - expo-router@58.0.27
  - expo-dev-client@58.0.16
  - expo-dev-launcher@58.0.16
  - expo-dev-menu@58.0.12
